# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: airflow-coordinator-k8s
title: Airflow Coordinator
summary: A charm to coordinate Airflow Core charms
description: |
  A charm to coordinate Airflow Core charms.

  Serves as a hub to gather cluster wide configurations, generate and disseminate
  a unified Airflow configuration, and orchestrate pre-flight checks for the Airflow
  cluster.

links:
  contact: Workflows Team <workflows-charmers@canonical.com>
  # documentation: <insert documentation link>
  issues:
    - https://github.com/canonical/airflow-coordinator-k8s-operator/issues
  source:
    - https://github.com/canonical/airflow-coordinator-k8s-operator
  # website: <insert charmhub listing link>

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
  files:
    plugin: dump
    source: .
    stage:
      - LICENSE

containers:
  airflow-coordinator:
    resource: airflow-coordinator-image

resources:
  airflow-coordinator-image:
    type: oci-image
    description: Airflow workload container for running commands
    upstream-source: ubuntu/airflow:3.1-24.04_edge

provides:
  airflow-coordinator:
    interface: airflow_coordinator

requires:
  postgres:
    interface: postgresql_client
    limit: 1
  airflow-api-server:
    interface: airflow_api_server
  airflow-kubernetes-executor-config:
    interface: airflow_kubernetes_executor
    limit: 1
  s3:
    interface: s3
  git:
    interface: git

peers:
  coordinator-peers:
    interface: coordinator_peers

config:
  options:
    fernet_key_secret:
      type: secret
      description: |
        URI of secret with fernet key that Airflow should use to encrypt passwords
        and variables before persisting in the metadata database.
    core_default_timezone:
      type: string
      default: utc
      description: |
        Value for core.default_timezone in the airflow.cfg file

        Default timezone in case supplied date times are naive.
        Can be UTC (default), system, or any IANA <https://www.iana.org/time-zones> timezone string
    core_max_active_runs_per_dag:
      type: int
      default: 16
      description: |
        Value for core.max_active_runs_per_dag in the airflow.cfg file

        The maximum number of active DAG runs per DAG. The scheduler will not create
        more DAG runs if it reaches the limit
    core_max_active_tasks_per_dag:
      type: int
      default: 16
      description: |
        Value for core.max_active_tasks_per_dag in the airflow.cfg file

        The maximum number of task instances allowed to run concurrently in each dag run.
        An example scenario when this would be useful is when you want to stop a new dag
        run with an early start date from occupying all the executor slots in a cluster
    core_parallelism:
      type: int
      default: 32
      description: |
        Value for core.parallelism in the airflow.cfg file

        Defines the maximum number of task instances that can run concurrently per
        scheduler in Airflow, regardless of the worker count. Generally, this value,
        multiplied by the number of schedulers in the cluster, is the maximum number
        of task instances with the running state in the metadata database
    dag_processor_parsing_processes:
      type: int
      default: 2
      description: |
        Value for dag_processor.parsing_processes in airflow.cfg file

        The DAG processor can run multiple processes in parallel to parse DAGs.
        This configuration defines how many such processes will run for each DAG processor
    database_sql_alchemy_pool_size:
      type: int
      default: 5
      description: |
        Value for database.sql_alchemy_pool_size in airflow.cfg file

        The SQLAlchemy pool size is the maximum number of database connections in the pool.
        0 indicates no limit
    triggerer_capacity:
      type: int
      default: 1000
      description: |
        Value for triggerer.capacity in airflow.cfg file

        Number of triggers a single triggerer will run at once by default
