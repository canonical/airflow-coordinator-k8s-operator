name: Release charm

on:
  push:
    branches:
      - track/**
      - feature/add_release_ci

jobs:
  # tests:
  #   name: Release tests
  #   uses: ./.github/workflows/ci.yaml

  collect-build-platforms:
    name: Collect charm build platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gather platforms
        id: gather_platforms
        run: |
          platforms=$(yq -o json '.platforms | keys' charmcraft.yaml | sed "s/amd64/ubuntu-latest/g" | sed "s/arm64/ubuntu-24.04-arm/g")

          echo $platforms >> "$GITHUB_OUTPUT"
    outputs:
      platforms: ${{ steps.gather_platforms.outputs.platforms }}

  build:
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.collect-build-platforms.outputs.platforms) }}
    name: 'Build charm | ${{ matrix.platform }}'
    needs:
      - collect-build-platforms
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up environment
        run: |
          sudo snap install concierge --classic

          sudo -E concierge prepare -p crafts

      - name: Build charm
        id: build_charm
        run: |
          just build-charm
          echo "charm_file=$(ls *.charm | grep 'airflow-coordinator')" >> "$GITHUB_OUTPUT"

      - name: Print charm filename
        run: ls *charm

      - name: Charmcraft logs
        if: ${{ success() || (failure() && steps.pack.outcome == 'failure') }}
        run: cat ~/.local/state/charmcraft/log/*

      - run: touch .empty

      - name: Upload charm package
        uses: actions/upload-artifact@v5
        with:
          name: airflow-coordinator-platform-${{ matrix.platform }}
          # .empty file required to preserve directory structure
          # See https://github.com/actions/upload-artifact/issues/344#issuecomment-1379232156
          path: |
            ./*.charm
            .empty
          if-no-files-found: error

    outputs:
      charm_file: ${{ steps.build_charm.outputs.charm_file }}

  release:
    name: Release charm
    runs-on: ubuntu-latest
    needs:
      # - tests
      - build
    steps:
      - name: Print marker
        run: echo 'hello'

