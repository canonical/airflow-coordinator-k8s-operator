name: Release charm

on:
  push:
    branches:
      - track/**
      - feature/add_release_ci

jobs:
  tests:
    name: Release tests
    uses: ./.github/workflows/ci.yaml

  collect-build-platforms:
    name: Collect charm build platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gather platforms
        id: gather_platforms
        run: |
          echo "platforms=$(yq -o json '.platforms | keys | .[]' charmcraft.yaml)" >> "$GITHUB_OUTPUT"
    outputs:
      platforms: ${{ steps.gather_platforms.outputs.platforms }}

  build:
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.collect-build-platforms.outputs.platforms) }}
    name: 'Build charm | ${{ matrix.platform.runner }}'
    needs:
      - collect-build-platforms
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build charm
        id: build_charm
        run: |
          just build-charm
          echo "charm_file=$(ls *.charm | grep 'airflow-coordinator')" >> "$GITHUB_OUTPUT"

          echo $(ls *.charm | grep 'airflow-coordinator')
    outputs:
      charm_file: ${{ steps.build_charm.outputs.charm_file }}

  release:
    name: Release charm
    needs:
      - tests
      - build
    steps:
      - name: Print marker
        run: echo 'hello'

