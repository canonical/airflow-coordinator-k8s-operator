name: nightly-juju4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tests:
    uses: canonical/workflows-team/.github/workflows/juju-nightly.yaml@main
    with:
      juju-channel: "4.1/edge"
      test-commands: '["just integration"]'
      setup-command: uv tool install tox
      purge-docker: true
      free-disk-space: true
      issue-label: juju-4
