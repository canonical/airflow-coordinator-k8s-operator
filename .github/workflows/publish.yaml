name: Publish charm

on:
  push:
    branches:
      - track/**
    paths-ignore:
      - '.github/workflows/ci.yaml'

jobs:
  tests:
    name: Release tests
    uses: ./.github/workflows/tests.yaml

  collect-build-platforms:
    name: Collect charm build platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gather platforms
        id: gather_platforms
        run: |
          platforms=$(yq -o json '.platforms | keys // ["amd64"]' charmcraft.yaml)

          for platform in $(jq -r '.[]' <<< "$platforms"); do
              case "$platform" in
                amd64) runner="ubuntu-latest" ;;
                arm64) runner="ubuntu-24.04-arm" ;;
                *)
                  echo "Unsupported platform '$platform' in $cfg" >&2
                  exit 1
                  ;;
              esac

              architectures=$(jq \
                --arg platform "$platform" \
                --arg runner "$runner" \
                '.include += [{"platform":$platform,"runner":$runner}]' \
                <<< "$matrix")
            done

          echo "architectures=$architectures" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.gather_platforms.outputs.architectures }}

  build:
    strategy:
      matrix:
        architectures: ${{ fromJSON(needs.collect-build-platforms.outputs.architectures) }}
    name: 'Build charm | ${{ matrix.architectures.platform }}'
    needs:
      - collect-build-platforms
    runs-on: ${{ matrix.architectures.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload charm package
        uses: canonical/charming-actions/upload-charm@2.6.2
        with:
          credentials: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          channel: 3.1/edge
          tag-prefix: airflow-coordinator
          charmcraft-channel: 3.x/stable
