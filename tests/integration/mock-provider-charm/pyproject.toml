[project]
name = "mock-provider-charm"
version = "0.0.1"
# Matches the coordinator: the shared charmlib requires >=3.12.
requires-python = ">=3.12"

# Dependencies of the charm code
# You should include the dependencies of the code in src/. You should also include the
# dependencies of any charmlibs that the charm uses (copy the dependencies from PYDEPS).
dependencies = [
    "ops>=3,<4",
    # Pinned to the same ref as the coordinator: the point of these tests is to
    # exercise both sides of one interface version, so a drift between the two
    # would silently weaken them.
    "airflow-provider-configurator-charmlib @ git+https://github.com/canonical/airflow-provider-configurator.git@track/1.0#subdirectory=lib",
]

[dependency-groups]
# Dependencies of linting and static type checks
lint = [
    "ruff",
    "codespell",
    "pyright",
]

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]

[tool.ruff.lint.mccabe]
max-complexity = 10
